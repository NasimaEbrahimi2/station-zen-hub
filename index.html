<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fuel Station Management — مدیریت پمپ بنزین</title>
<meta name="description" content="Single-file fuel station management system: pumps, inventory, sales, invoices, customers, employees, reports." />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #f1f5f9; --muted: #94a3b8; --primary: #3b82f6; --accent: #10b981;
  }
  body { background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, sans-serif; }
  [dir="rtl"] body { font-family: Tahoma, "Vazirmatn", sans-serif; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .btn { padding: 8px 14px; border-radius: 8px; font-weight: 500; transition: opacity .15s; cursor: pointer; }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: #ef4444; color: white; }
  .input { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
  .input:focus { outline: none; border-color: var(--primary); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .nav-item:hover { background: #334155; color: var(--text); }
  .nav-item.active { background: var(--primary); color: white; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--card); border-radius: 14px; padding: 24px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 border-r border-slate-700 p-4 hidden md:flex flex-col">
    <div class="flex items-center gap-3 mb-6 px-2">
      <div class="size-10 rounded-xl bg-blue-500 grid place-items-center text-xl">⛽</div>
      <div>
        <div class="font-semibold" id="brand-en">Fuel Station</div>
        <div class="text-xs text-slate-400" id="brand-fa">پمپ بنزین</div>
      </div>
    </div>
    <nav class="flex flex-col gap-1 flex-1" id="nav"></nav>
    <button class="btn btn-ghost mt-4 text-sm" onclick="toggleLang()">
      <span id="lang-label">فا / EN</span>
    </button>
  </aside>

  <!-- Main -->
  <main class="flex-1 p-4 md:p-8 overflow-auto">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold" id="page-title">Dashboard</h1>
        <p class="text-sm text-slate-400" id="page-sub">Overview of your station</p>
      </div>
      <div class="md:hidden">
        <select class="input" onchange="navigate(this.value)" id="mobile-nav"></select>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ===== i18n =====
const T = {
  dashboard: ['Dashboard', 'داشبورد'],
  pumps: ['Pumps', 'پمپ‌ها'],
  inventory: ['Inventory', 'انبار'],
  sale: ['New Sale', 'فروش جدید'],
  invoices: ['Invoices', 'فاکتورها'],
  customers: ['Customers', 'مشتریان'],
  employees: ['Employees', 'کارمندان'],
  reports: ['Reports', 'گزارش‌ها'],
  settings: ['Settings', 'تنظیمات'],
  add: ['Add', 'افزودن'],
  name: ['Name', 'نام'],
  phone: ['Phone', 'تلفن'],
  role: ['Role', 'نقش'],
  salary: ['Salary', 'حقوق'],
  fuel: ['Fuel', 'سوخت'],
  price: ['Price/L', 'قیمت/لیتر'],
  liters: ['Liters', 'لیتر'],
  total: ['Total', 'مجموع'],
  status: ['Status', 'وضعیت'],
  actions: ['Actions', 'عملیات'],
  edit: ['Edit', 'ویرایش'],
  delete: ['Delete', 'حذف'],
  save: ['Save', 'ذخیره'],
  cancel: ['Cancel', 'انصراف'],
  stock: ['Stock (L)', 'موجودی (لیتر)'],
  capacity: ['Capacity', 'ظرفیت'],
  pumpNo: ['Pump #', 'شماره پمپ'],
  customer: ['Customer', 'مشتری'],
  date: ['Date', 'تاریخ'],
  paid: ['Paid', 'پرداخت شده'],
  unpaid: ['Unpaid', 'پرداخت نشده'],
  active: ['Active', 'فعال'],
  inactive: ['Inactive', 'غیرفعال'],
  totalSales: ['Total Sales', 'کل فروش'],
  totalLiters: ['Total Liters', 'کل لیتر'],
  customers_count: ['Customers', 'مشتریان'],
  pumps_count: ['Active Pumps', 'پمپ فعال'],
  salesByFuel: ['Sales by Fuel Type', 'فروش بر اساس نوع سوخت'],
  salesTrend: ['Sales Trend (Last 7)', 'روند فروش (۷ آخر)'],
  recentSales: ['Recent Sales', 'فروش‌های اخیر'],
  noData: ['No data yet', 'داده‌ای وجود ندارد'],
  language: ['Language', 'زبان'],
  english: ['English', 'انگلیسی'],
  persian: ['Persian / Dari', 'فارسی / دری'],
  company: ['Company Name', 'نام شرکت'],
  export: ['Export CSV', 'خروجی CSV'],
  print: ['Print', 'چاپ'],
};
let lang = localStorage.getItem('lang') || 'en';
function t(k) { return T[k] ? T[k][lang === 'fa' ? 1 : 0] : k; }
function toggleLang() {
  lang = lang === 'en' ? 'fa' : 'en';
  localStorage.setItem('lang', lang);
  applyLang();
  render();
}
function applyLang() {
  document.documentElement.lang = lang === 'fa' ? 'fa' : 'en';
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  document.getElementById('lang-label').textContent = lang === 'fa' ? 'EN' : 'فارسی';
}

// ===== Storage =====
const DB = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('fs_' + k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem('fs_' + k, JSON.stringify(v)); },
};
function seed() {
  if (!DB.get('seeded')) {
    DB.set('pumps', [
      { id: 1, no: 'P-01', fuel: 'Petrol', price: 60, active: true },
      { id: 2, no: 'P-02', fuel: 'Diesel', price: 55, active: true },
      { id: 3, no: 'P-03', fuel: 'Premium', price: 75, active: false },
    ]);
    DB.set('inventory', [
      { id: 1, fuel: 'Petrol', stock: 8500, capacity: 10000 },
      { id: 2, fuel: 'Diesel', stock: 6200, capacity: 10000 },
      { id: 3, fuel: 'Premium', stock: 3100, capacity: 5000 },
    ]);
    DB.set('customers', [
      { id: 1, name: 'Ahmad Karimi', phone: '0700-123456' },
      { id: 2, name: 'Sara Rahimi', phone: '0700-654321' },
    ]);
    DB.set('employees', [
      { id: 1, name: 'Reza Noori', role: 'Cashier', salary: 12000 },
      { id: 2, name: 'Mina Ahmadi', role: 'Pump Attendant', salary: 9000 },
    ]);
    DB.set('invoices', []);
    DB.set('seeded', true);
  }
}
function uid() { return Date.now() + Math.floor(Math.random() * 1000); }

// ===== Routing =====
const ROUTES = ['dashboard','pumps','inventory','sale','invoices','customers','employees','reports','settings'];
const ICONS = { dashboard:'📊', pumps:'⛽', inventory:'📦', sale:'🛒', invoices:'🧾', customers:'👥', employees:'👷', reports:'📈', settings:'⚙️' };
let current = 'dashboard';
function navigate(r) { current = r; render(); }

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = ROUTES.map(r =>
    `<div class="nav-item ${r===current?'active':''}" onclick="navigate('${r}')">
      <span>${ICONS[r]}</span><span>${t(r)}</span>
    </div>`).join('');
  const mob = document.getElementById('mobile-nav');
  mob.innerHTML = ROUTES.map(r => `<option value="${r}" ${r===current?'selected':''}>${ICONS[r]} ${t(r)}</option>`).join('');
}

// ===== Views =====
function render() {
  applyLang();
  renderNav();
  document.getElementById('page-title').textContent = t(current);
  document.getElementById('page-sub').textContent = '';
  const v = document.getElementById('view');
  v.innerHTML = '';
  views[current](v);
}

const views = {
  dashboard(el) {
    const invoices = DB.get('invoices', []);
    const totalSales = invoices.reduce((s,i)=>s+i.total,0);
    const totalLiters = invoices.reduce((s,i)=>s+i.liters,0);
    const cust = DB.get('customers',[]).length;
    const pumps = DB.get('pumps',[]).filter(p=>p.active).length;
    el.innerHTML = `
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        ${kpi(t('totalSales'), totalSales.toFixed(0)+' AFN', '💰')}
        ${kpi(t('totalLiters'), totalLiters.toFixed(0)+' L', '⛽')}
        ${kpi(t('customers_count'), cust, '👥')}
        ${kpi(t('pumps_count'), pumps, '🔧')}
      </div>
      <div class="grid lg:grid-cols-2 gap-4 mb-6">
        <div class="card p-4"><h3 class="font-semibold mb-3">${t('salesByFuel')}</h3><canvas id="c1" height="160"></canvas></div>
        <div class="card p-4"><h3 class="font-semibold mb-3">${t('salesTrend')}</h3><canvas id="c2" height="160"></canvas></div>
      </div>
      <div class="card p-4">
        <h3 class="font-semibold mb-3">${t('recentSales')}</h3>
        ${invoices.length===0 ? `<p class="text-slate-400 text-sm">${t('noData')}</p>` :
          tableHTML([t('date'),t('customer'),t('fuel'),t('liters'),t('total'),t('status')],
            invoices.slice(-5).reverse().map(i=>[i.date, i.customer, i.fuel, i.liters, i.total.toFixed(0), badge(i.paid?t('paid'):t('unpaid'), i.paid?'green':'red')]))}
      </div>`;
    drawCharts(invoices);
  },

  pumps(el) {
    const pumps = DB.get('pumps', []);
    el.innerHTML = listShell(t('pumps'), 'pump', tableHTML(
      [t('pumpNo'),t('fuel'),t('price'),t('status'),t('actions')],
      pumps.map(p=>[p.no, p.fuel, p.price, badge(p.active?t('active'):t('inactive'), p.active?'green':'gray'),
        actionBtns('pump', p.id)])));
  },

  inventory(el) {
    const inv = DB.get('inventory', []);
    el.innerHTML = listShell(t('inventory'), 'inv', tableHTML(
      [t('fuel'),t('stock'),t('capacity'),'%',t('actions')],
      inv.map(i=>{
        const pct = Math.round((i.stock/i.capacity)*100);
        return [i.fuel, i.stock, i.capacity,
          `<div class="w-32 bg-slate-700 rounded h-2"><div class="h-2 rounded ${pct<30?'bg-red-500':pct<60?'bg-yellow-500':'bg-green-500'}" style="width:${pct}%"></div></div>`,
          actionBtns('inv', i.id)];
      })));
  },

  sale(el) {
    const pumps = DB.get('pumps', []).filter(p=>p.active);
    const customers = DB.get('customers', []);
    el.innerHTML = `
      <div class="card p-6 max-w-xl">
        <h3 class="font-semibold mb-4">${t('sale')}</h3>
        <div class="space-y-3">
          <div><label class="text-sm text-slate-400">${t('customer')}</label>
            <select class="input" id="s-cust"><option value="Walk-in">Walk-in</option>${customers.map(c=>`<option>${c.name}</option>`).join('')}</select></div>
          <div><label class="text-sm text-slate-400">${t('pumpNo')}</label>
            <select class="input" id="s-pump" onchange="updateSaleTotal()">${pumps.map(p=>`<option data-price="${p.price}" data-fuel="${p.fuel}">${p.no} — ${p.fuel} @ ${p.price}</option>`).join('')}</select></div>
          <div><label class="text-sm text-slate-400">${t('liters')}</label>
            <input type="number" min="0" step="0.01" class="input" id="s-liters" oninput="updateSaleTotal()" value="10"></div>
          <div class="text-2xl font-bold">${t('total')}: <span id="s-total">—</span> AFN</div>
          <div class="flex gap-2">
            <button class="btn btn-primary flex-1" onclick="completeSale(true)">${t('paid')}</button>
            <button class="btn btn-ghost flex-1" onclick="completeSale(false)">${t('unpaid')}</button>
          </div>
        </div>
      </div>`;
    updateSaleTotal();
  },

  invoices(el) {
    const inv = DB.get('invoices', []);
    el.innerHTML = `
      <div class="flex gap-2 mb-4">
        <button class="btn btn-ghost" onclick="exportCSV('invoices')">${t('export')}</button>
        <button class="btn btn-ghost" onclick="window.print()">${t('print')}</button>
      </div>
      <div class="card p-4">
      ${inv.length===0 ? `<p class="text-slate-400">${t('noData')}</p>` :
        tableHTML([t('date'),t('customer'),t('fuel'),t('liters'),t('total'),t('status'),t('actions')],
          inv.slice().reverse().map(i=>[i.date, i.customer, i.fuel, i.liters, i.total.toFixed(0),
            badge(i.paid?t('paid'):t('unpaid'), i.paid?'green':'red'),
            `<button class="btn btn-danger text-xs" onclick="deleteItem('invoices',${i.id})">${t('delete')}</button>`]))}
      </div>`;
  },

  customers(el) {
    const c = DB.get('customers', []);
    el.innerHTML = listShell(t('customers'), 'cust', tableHTML(
      [t('name'),t('phone'),t('actions')],
      c.map(x=>[x.name, x.phone, actionBtns('cust', x.id)])));
  },

  employees(el) {
    const e = DB.get('employees', []);
    el.innerHTML = listShell(t('employees'), 'emp', tableHTML(
      [t('name'),t('role'),t('salary'),t('actions')],
      e.map(x=>[x.name, x.role, x.salary, actionBtns('emp', x.id)])));
  },

  reports(el) {
    const inv = DB.get('invoices', []);
    const totalSales = inv.reduce((s,i)=>s+i.total,0);
    const totalLiters = inv.reduce((s,i)=>s+i.liters,0);
    const paid = inv.filter(i=>i.paid).reduce((s,i)=>s+i.total,0);
    const unpaid = totalSales - paid;
    el.innerHTML = `
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        ${kpi(t('totalSales'), totalSales.toFixed(0), '💰')}
        ${kpi(t('totalLiters'), totalLiters.toFixed(0), '⛽')}
        ${kpi(t('paid'), paid.toFixed(0), '✅')}
        ${kpi(t('unpaid'), unpaid.toFixed(0), '⏳')}
      </div>
      <div class="grid lg:grid-cols-2 gap-4 mb-6">
        <div class="card p-4"><h3 class="font-semibold mb-3">${t('salesByFuel')}</h3><canvas id="c1" height="200"></canvas></div>
        <div class="card p-4"><h3 class="font-semibold mb-3">${t('salesTrend')}</h3><canvas id="c2" height="200"></canvas></div>
      </div>
      <button class="btn btn-ghost mb-3" onclick="exportCSV('invoices')">${t('export')}</button>
      <div class="card p-4">
      ${tableHTML([t('date'),t('customer'),t('fuel'),t('liters'),t('total'),t('status')],
        inv.slice().reverse().map(i=>[i.date,i.customer,i.fuel,i.liters,i.total.toFixed(0),
          badge(i.paid?t('paid'):t('unpaid'), i.paid?'green':'red')]))}
      </div>`;
    drawCharts(inv);
  },

  settings(el) {
    const co = localStorage.getItem('company_name') || '';
    el.innerHTML = `
      <div class="card p-6 max-w-lg space-y-4">
        <div>
          <label class="text-sm text-slate-400">${t('company')}</label>
          <input class="input" id="co" value="${co}">
        </div>
        <div>
          <label class="text-sm text-slate-400">${t('language')}</label>
          <div class="flex gap-2 mt-1">
            <button class="btn ${lang==='en'?'btn-primary':'btn-ghost'} flex-1" onclick="lang='en';localStorage.setItem('lang','en');render()">${t('english')}</button>
            <button class="btn ${lang==='fa'?'btn-primary':'btn-ghost'} flex-1" onclick="lang='fa';localStorage.setItem('lang','fa');render()">${t('persian')}</button>
          </div>
        </div>
        <button class="btn btn-primary" onclick="localStorage.setItem('company_name',document.getElementById('co').value);alert('Saved')">${t('save')}</button>
        <hr class="border-slate-700">
        <button class="btn btn-danger" onclick="if(confirm('Reset all data?')){localStorage.clear();location.reload()}">Reset Data</button>
      </div>`;
  },
};

// ===== Helpers =====
function kpi(label, val, icon) {
  return `<div class="card p-4">
    <div class="flex items-center justify-between">
      <div><div class="text-xs text-slate-400">${label}</div><div class="text-2xl font-bold mt-1">${val}</div></div>
      <div class="text-3xl">${icon}</div>
    </div></div>`;
}
function tableHTML(headers, rows) {
  return `<div class="overflow-x-auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function badge(text, color) {
  const c = { green:'bg-green-500/20 text-green-300', red:'bg-red-500/20 text-red-300', gray:'bg-slate-500/20 text-slate-300' }[color];
  return `<span class="badge ${c}">${text}</span>`;
}
function listShell(title, kind, body) {
  return `<div class="flex justify-between mb-4">
    <button class="btn btn-primary" onclick="openForm('${kind}')">+ ${t('add')}</button>
    <button class="btn btn-ghost" onclick="exportCSV('${kind==='cust'?'customers':kind==='emp'?'employees':kind==='inv'?'inventory':'pumps'}')">${t('export')}</button>
  </div><div class="card p-4">${body}</div>`;
}
function actionBtns(kind, id) {
  return `<button class="btn btn-ghost text-xs" onclick="openForm('${kind}',${id})">${t('edit')}</button>
    <button class="btn btn-danger text-xs" onclick="deleteItem('${kindKey(kind)}',${id})">${t('delete')}</button>`;
}
function kindKey(k) { return {pump:'pumps',inv:'inventory',cust:'customers',emp:'employees'}[k]; }

function deleteItem(key, id) {
  if (!confirm('Delete?')) return;
  DB.set(key, DB.get(key,[]).filter(x=>x.id!==id));
  render();
}

// ===== Forms =====
const FORMS = {
  pump: { key:'pumps', fields:[['no','pumpNo','text'],['fuel','fuel','text'],['price','price','number'],['active','status','bool']] },
  inv:  { key:'inventory', fields:[['fuel','fuel','text'],['stock','stock','number'],['capacity','capacity','number']] },
  cust: { key:'customers', fields:[['name','name','text'],['phone','phone','text']] },
  emp:  { key:'employees', fields:[['name','name','text'],['role','role','text'],['salary','salary','number']] },
};
function openForm(kind, id) {
  const f = FORMS[kind];
  const item = id ? DB.get(f.key,[]).find(x=>x.id===id) : {};
  const m = document.getElementById('modal-content');
  m.innerHTML = `<h3 class="text-lg font-semibold mb-4">${id?t('edit'):t('add')}</h3>
    <div class="space-y-3">
      ${f.fields.map(([name,label,type])=>`
        <div><label class="text-sm text-slate-400">${t(label)}</label>
          ${type==='bool'
            ? `<select class="input" id="f-${name}"><option value="true" ${item[name]?'selected':''}>${t('active')}</option><option value="false" ${!item[name]&&item[name]!==undefined?'selected':''}>${t('inactive')}</option></select>`
            : `<input class="input" id="f-${name}" type="${type}" value="${item[name]??''}">`}
        </div>`).join('')}
    </div>
    <div class="flex gap-2 mt-5">
      <button class="btn btn-primary flex-1" onclick="saveForm('${kind}',${id||'null'})">${t('save')}</button>
      <button class="btn btn-ghost flex-1" onclick="closeModal()">${t('cancel')}</button>
    </div>`;
  document.getElementById('modal').classList.add('open');
}
function saveForm(kind, id) {
  const f = FORMS[kind];
  const data = id ? DB.get(f.key,[]).find(x=>x.id===id) : { id: uid() };
  f.fields.forEach(([name,,type])=>{
    const v = document.getElementById('f-'+name).value;
    data[name] = type==='number' ? parseFloat(v)||0 : type==='bool' ? v==='true' : v;
  });
  const list = DB.get(f.key, []);
  if (id) {
    DB.set(f.key, list.map(x=>x.id===id?data:x));
  } else {
    DB.set(f.key, [...list, data]);
  }
  closeModal();
  render();
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

// ===== Sale =====
function updateSaleTotal() {
  const sel = document.getElementById('s-pump');
  if (!sel) return;
  const price = parseFloat(sel.selectedOptions[0]?.dataset.price || 0);
  const liters = parseFloat(document.getElementById('s-liters').value || 0);
  document.getElementById('s-total').textContent = (price * liters).toFixed(2);
}
function completeSale(paid) {
  const sel = document.getElementById('s-pump');
  const opt = sel.selectedOptions[0];
  if (!opt) return alert('No active pumps');
  const price = parseFloat(opt.dataset.price);
  const fuel = opt.dataset.fuel;
  const liters = parseFloat(document.getElementById('s-liters').value || 0);
  if (liters <= 0) return alert('Enter liters');
  const customer = document.getElementById('s-cust').value;
  const invoice = { id: uid(), date: new Date().toISOString().slice(0,10), customer, fuel, liters, total: price*liters, paid };
  DB.set('invoices', [...DB.get('invoices',[]), invoice]);
  // reduce stock
  const inv = DB.get('inventory',[]);
  const found = inv.find(i=>i.fuel===fuel);
  if (found) { found.stock = Math.max(0, found.stock - liters); DB.set('inventory', inv); }
  alert('Sale recorded');
  navigate('invoices');
}

// ===== Charts =====
let charts = [];
function drawCharts(invoices) {
  charts.forEach(c=>c.destroy());
  charts = [];
  const c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
  if (c1) {
    const byFuel = {};
    invoices.forEach(i=>byFuel[i.fuel]=(byFuel[i.fuel]||0)+i.total);
    charts.push(new Chart(c1, { type:'doughnut', data:{ labels:Object.keys(byFuel).length?Object.keys(byFuel):['(none)'],
      datasets:[{ data:Object.values(byFuel).length?Object.values(byFuel):[1], backgroundColor:['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6'] }] },
      options:{ plugins:{ legend:{ labels:{ color:'#cbd5e1' } } } } }));
  }
  if (c2) {
    const days = Array.from({length:7},(_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(6-i)); return d.toISOString().slice(0,10); });
    const totals = days.map(d=>invoices.filter(i=>i.date===d).reduce((s,i)=>s+i.total,0));
    charts.push(new Chart(c2, { type:'line', data:{ labels:days.map(d=>d.slice(5)),
      datasets:[{ label:t('totalSales'), data:totals, borderColor:'#3b82f6', backgroundColor:'rgba(59,130,246,.2)', fill:true, tension:.3 }] },
      options:{ scales:{ x:{ ticks:{ color:'#94a3b8' } }, y:{ ticks:{ color:'#94a3b8' } } }, plugins:{ legend:{ labels:{ color:'#cbd5e1' } } } } }));
  }
}

// ===== Export =====
function exportCSV(key) {
  const data = DB.get(key, []);
  if (!data.length) return alert('No data');
  const headers = Object.keys(data[0]);
  const csv = [headers.join(','), ...data.map(r=>headers.map(h=>JSON.stringify(r[h]??'')).join(','))].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = key+'.csv'; a.click();
}

// ===== Boot =====
seed();
render();
</script>
